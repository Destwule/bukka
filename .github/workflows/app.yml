name: app

# Tests the Bukka application itself: API tests and a web build.
on:
  push:
    branches: [main, "lab-test/**"]
  pull_request:
    branches: [main, "apprentice/**"]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # A real Redis for the worker test (the other tests fake it).
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'api[dev]'
      - run: pytest -q
        working-directory: api
        env:
          BUKKA_TEST_REDIS_URL: redis://127.0.0.1:6379/15

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
